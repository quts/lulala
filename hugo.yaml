  homeInfoParams:
    Title: "About Not To Work Lab"
    Content: "Don't talk to me about dreams while I'm working; my dream is not to work. This is my Not To Work Lab—a personal space where I experiment and learn after my day job. The goal? To reach a day where work is no longer a necessity, and I can learn new things purely for the fun of it."
