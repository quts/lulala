  homeInfoParams:
    Title: "About Not To Work Lab"
    Content: 'Every time I share a fun fact with my wife — something quirky, fascinating, or just plain random — she smiles and says, "Okay, 無用的小知識 +1," which means "one more piece of useless knowledge." It is our little inside joke. This site, Not To Work Lab.com, to collect the things my wife thinks are useless — but who knows, they might just be meaningful to you and me.'
